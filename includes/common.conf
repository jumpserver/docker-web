
    # For wecom verify
    location ~* ^/WW_verify_[^.]+\.txt$ {
        root /opt/jumpserver/data/;
    }

    # For acme challenge
    location /.well-known/ {
        root /opt/jumpserver/data/;
    }

    location = /robots.txt {
        default_type text/html;
        add_header Content-Type "text/plain; charset=UTF-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /web/health/ {
        access_log off;
        default_type application/json;
        return 200 '{"status": "ok"}';
    }

    location /player/ {
        try_files $uri / /index.html;
        alias /opt/player/;
    }

    location /ui/ {
        try_files $uri / /index.html;
        alias /opt/lina/;
    }

    location /luna/ {
        try_files $uri / /index.html;
        alias /opt/luna/;
        # Keep Luna documents out of the Back-Forward Cache so a page with an
        # open terminal websocket is never frozen and drained by the browser.
        # Only affects document navigations; see luna-bfcache.conf.
        add_header Cache-Control $luna_cache_control always;
    }

    location /download/ {
        alias /opt/download/;
        try_files $uri @redirect_oss;
    }

    location @redirect_oss {
        rewrite ^/download/(.*)$ https://static.jumpserver.org/download/$1;
    }