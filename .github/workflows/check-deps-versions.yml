on:
  repository_dispatch:
    types: [client-released, weblite-released]
  schedule:
    - cron: "0 1 * * *"
  push:
    branches:
      - dev

name: Check Dependencies Versions

concurrency:
  group: dependency-versions-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
    strategy:
      matrix:
        branch: [dev]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          token: ${{ secrets.PRIVATE_TOKEN }}

      - name: Validate independent product versions
        run: node --test --test-concurrency=1 .github/scripts/client-versions.test.mjs

      - name: Set up Git
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Check if branch exists
        id: check_branch
        run: |
          BRANCH_EXISTS=$(git ls-remote --heads origin pr@${{ matrix.branch }}@upgrade_client)
          if [ -n "$BRANCH_EXISTS" ]; then
            echo "Branch exists, checking it out."
            echo "branch_exists=true" >> $GITHUB_ENV
          else
            echo "Branch does not exist, will create new one."
            echo "branch_exists=false" >> $GITHUB_ENV
          fi

      - name: Checkout existing branch or create new one
        run: |
          if [ "$branch_exists" == "true" ]; then
            git checkout -B pr@${{ matrix.branch }}@upgrade_client origin/${{ matrix.branch }}
          else
            git checkout -b pr@${{ matrix.branch }}@upgrade_client
          fi

      - name: Check Client and WebLite releases
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PRIVATE_TOKEN }}
          script: |
            const { readFile, writeFile } = require('node:fs/promises');
            const { pathToFileURL } = require('node:url');
            const { updateClientVersions } = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/client-versions.mjs`
            ));
            // Recheck both products on every event; delayed notifications must not
            // roll back a pin or erase the other product's pending update.
            const path = 'client-version.txt';
            const previous = await readFile(path, 'utf8');
            let content = previous;
            // ponytail: inspect at most 1,000 recent releases, one page at a time.
            // Raise this limit if a product's releases fall outside that window.
            for (let page = 1; page <= 10; page++) {
              const { data } = await github.rest.repos.listReleases({
                owner: 'jumpserver', repo: 'luna', per_page: 100, page,
              });
              content = updateClientVersions(content, data);
              if (data.length < 100) break;
            }
            if (content !== previous) await writeFile(path, content);

      - name: Check tinker version
        run: |
          version=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/jumpserver/tinker/releases/latest | jq -r .tag_name)
          sed -i "s/TINKER_VERSION=.*/TINKER_VERSION=${version}/g" versions.txt

      - name: Need update
        run: |
          need_update=0
          if [ -n "$(git status --porcelain)" ]; then
            need_update=1
          fi
          echo "need_update=${need_update}" >> $GITHUB_ENV

      - name: Update Client Version
        if: env.need_update == '1'
        run: |
          git add client-version.txt versions.txt
          git commit -m "Update pkg versions"
          if [ "$branch_exists" == "true" ]; then
            git push --force-with-lease origin pr@${{ matrix.branch }}@upgrade_client
          else
            git push origin pr@${{ matrix.branch }}@upgrade_client
          fi
